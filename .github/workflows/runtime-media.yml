name: Runtime Demo Capture

on:
  push:
    paths-ignore:
      - "assets/runtime-screenshot.png"
      - "assets/demo.gif"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install capture tools
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick xdotool
      - name: Compile
        run: |
          mkdir -p out
          find src -name "*.java" -print0 | xargs -0 javac -d out
      - name: Capture runtime screenshot and GIF
        run: |
          mkdir -p assets/capture-frames
          cat > Capture.java <<'JAVA'
          import java.awt.*;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          import main.Main;

          public class Capture {
            public static void main(String[] args) throws Exception {
              new Thread(() -> Main.main(new String[0])).start();
              Robot robot = new Robot();
              Thread.sleep(3500);
              Rectangle screen = new Rectangle(Toolkit.getDefaultToolkit().getScreenSize());
              for (int i = 0; i < 18; i++) {
                if (i == 3) { robot.keyPress(KeyEvent.VK_RIGHT); }
                if (i == 8) { robot.keyRelease(KeyEvent.VK_RIGHT); robot.keyPress(KeyEvent.VK_DOWN); }
                if (i == 13) { robot.keyRelease(KeyEvent.VK_DOWN); robot.keyPress(KeyEvent.VK_LEFT); }
                if (i == 17) { robot.keyRelease(KeyEvent.VK_LEFT); }
                BufferedImage image = robot.createScreenCapture(screen);
                ImageIO.write(image, "png", new File(String.format("assets/capture-frames/frame-%02d.png", i)));
                Thread.sleep(180);
              }
              ImageIO.write(robot.createScreenCapture(screen), "png", new File("assets/runtime-screenshot.png"));
              System.exit(0);
            }
          }
          JAVA
          sed -i 's/import java.awt.image.BufferedImage;/import java.awt.image.BufferedImage;\n          import java.awt.event.KeyEvent;/' Capture.java
          javac -cp out:res -d out Capture.java
          xvfb-run -a -s "-screen 0 1200x800x24" bash -lc '
            java -cp out:res Capture &
            CAPTURE_PID=$!
            for i in $(seq 1 30); do
              WID=$(xdotool search --name "Treasure Hunting" 2>/dev/null | head -n 1 || true)
              if [ -n "$WID" ]; then break; fi
              sleep 0.5
            done
            if [ -z "$WID" ]; then echo "Game window not found"; exit 1; fi
            xdotool windowactivate --sync "$WID"
            xdotool windowmap "$WID" || true
            sleep 1
            import -window "$WID" assets/runtime-screenshot.png
            for i in $(seq -w 0 17); do
              import -window "$WID" "assets/capture-frames/frame-$i.png"
              sleep 0.18
            done
            wait "$CAPTURE_PID" || true
          '
          convert -delay 9 -loop 0 assets/capture-frames/frame-*.png assets/demo.gif
          rm -rf assets/capture-frames Capture.java
      - name: Commit runtime media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/runtime-screenshot.png assets/demo.gif
          git diff --cached --quiet || git commit -m "Add actual runtime screenshot and GIF demo"
          git push
